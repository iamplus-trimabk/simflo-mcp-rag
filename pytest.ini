[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
markers =
    integration: Integration tests that test multiple components together
    unit: Unit tests that test individual components
    performance: Performance tests that measure execution time
    cli: Tests that command-line interfaces
    validation: Tests for validation functionality
    consistency: Tests for data consistency checking
    pipeline: Tests for pipeline configuration generation
    edge_case: Tests for edge cases and error conditions
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning